name: C Build & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }} with ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Source File and Compile
        run: |
          # Find the C source file (std.c or main.c or any root/subfolder .c file)
          SRC_FILE=$(find . -maxdepth 2 -name "*.c" | head -n 1)
          if [ -z "$SRC_FILE" ]; then
            echo "Error: No .c file found in the repository!"
            exit 1
          fi
          echo "Found source file: $SRC_FILE"
          ${{ matrix.compiler }} -Wall -Wextra -O2 -o hotel_system "$SRC_FILE"

      - name: Upload Linux Binary
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: hotel-system-linux-x64
          path: hotel_system
